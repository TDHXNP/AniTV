name: Release tvOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v0.2.2；留空则仅构建并上传 Artifact）'
        required: false
        default: ''
        type: string
      publish_release:
        description: '是否创建 / 更新 GitHub Release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '标记为 Pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Unsigned tvOS Release IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest compatible Xcode (tvOS 26.2+)
        run: |
          set -euo pipefail
          SELECTED_XCODE=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            if [[ -d "${app}/Contents/Developer/Platforms/AppleTVOS.platform" ]]; then
              SELECTED_XCODE="${app}"
              break
            fi
          done
          if [[ -n "${SELECTED_XCODE}" ]]; then
            echo "Selecting ${SELECTED_XCODE}"
            sudo xcode-select -s "${SELECTED_XCODE}/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Determine release version & artifact names
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
            IS_PRERELEASE="false"
            if [[ "${TAG_NAME}" == *-* ]]; then
              IS_PRERELEASE="true"
            fi
          else
            TAG_NAME="${{ inputs.tag }}"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          fi

          if [[ -n "${TAG_NAME}" ]]; then
            VERSION="${TAG_NAME#v}"
            # Strip pre-release suffix for MARKETING_VERSION (CFBundleShortVersionString)
            MARKETING_VERSION="${VERSION%%-*}"
            IPA_NAME="AniTV-${TAG_NAME}-tvos-unsigned.ipa"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            MARKETING_VERSION=""
            IPA_NAME="AniTV-${SHORT_SHA}-tvos-unsigned.ipa"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: .build-cache/SourcePackages
          key: spm-tvos-${{ runner.os }}-${{ hashFiles('AniTV.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            spm-tvos-${{ runner.os }}-

      - name: Prepare optional Secrets.plist from base64 secret
        env:
          SECRETS_PLIST_BASE64: ${{ secrets.SECRETS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${SECRETS_PLIST_BASE64}" ]]; then
            printf '%s' "${SECRETS_PLIST_BASE64}" | base64 --decode > AniTV/Secrets.plist
            echo "Decoded AniTV/Secrets.plist from SECRETS_PLIST_BASE64"
          fi

      - name: Build unsigned Release tvOS IPA
        env:
          BangumiOAuthClientID: ${{ secrets.BANGUMI_OAUTH_CLIENT_ID }}
          BangumiOAuthClientSecret: ${{ secrets.BANGUMI_OAUTH_CLIENT_SECRET }}
          TMDBApiKey: ${{ secrets.TMDB_API_KEY }}
          DanDanPlayAppId: ${{ secrets.DANDANPLAY_APP_ID }}
          DanDanPlayAppSecret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          IPA_NAME: ${{ steps.meta.outputs.ipa_name }}
          CLONED_SOURCE_PACKAGES_DIR_PATH: ${{ github.workspace }}/.build-cache/SourcePackages
          MARKETING_VERSION_OVERRIDE: ${{ steps.meta.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION_OVERRIDE: ${{ steps.meta.outputs.build_number }}
        run: |
          chmod +x scripts/build-user-signable-tvos-ipa.sh
          ./scripts/build-user-signable-tvos-ipa.sh

      - name: Cleanup temporary secrets before artifact upload
        if: always()
        run: |
          rm -f AniTV/Secrets.plist AniTV/Utils/GeneratedSecrets.swift

      - name: Upload IPA workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ipa_name }}
          path: |
            scripts/output/user-signable-ipa/${{ steps.meta.outputs.ipa_name }}
            scripts/output/user-signable-ipa/${{ steps.meta.outputs.ipa_name }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true' && steps.meta.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: AniTV ${{ steps.meta.outputs.tag_name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## 安装说明（未签名 tvOS IPA）

            - 本 Release 提供未签名 tvOS IPA（已内嵌 `AniTVTopShelf.appex` 与分层应用图标），请使用 [atvloadly](https://github.com/bitxeno/atvloadly) / [Sideloadly](https://sideloadly.io/index.html) 等工具使用个人证书重签后安装到 Apple TV。
            - 如需在桌面顶部展示栏（Top Shelf）同步「继续播放」，重签时请确保同时签名 `PlugIns/AniTVTopShelf.appex` 并为主 App 与扩展配置相同的 App Group。
          files: |
            scripts/output/user-signable-ipa/${{ steps.meta.outputs.ipa_name }}
            scripts/output/user-signable-ipa/${{ steps.meta.outputs.ipa_name }}.sha256
